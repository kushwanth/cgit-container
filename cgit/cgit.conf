root-title=$CGIT_TITLE
root-desc=$CGIT_DESC

about-filter=/usr/lib/cgit/filters/about-formatting.sh
head-include=/usr/share/webapps/cgit/head-include.html

readme=:README.md
readme=:readme.md
readme=:README.mkd
readme=:readme.mkd
readme=:README.rst
readme=:readme.rst
readme=:README.html
readme=:readme.html
readme=:README.htm
readme=:readme.htm
readme=:README.txt
readme=:readme.txt
readme=:README
readme=:readme
readme=:INSTALL.md
readme=:install.md
readme=:INSTALL.mkd
readme=:install.mkd
readme=:INSTALL.rst
readme=:install.rst
readme=:INSTALL.html
readme=:install.html
readme=:INSTALL.htm
readme=:install.htm
readme=:INSTALL.txt
readme=:install.txt
readme=:INSTALL
readme=:install

css=/cgit.css
logo=/cgit.png

cache-root=/var/cache/cgit
cache-size=10000
cache-root-ttl=60
cache-repo-ttl=60
cache-dynamic-ttl=60
cache-about-ttl=60
cache-snapshot-ttl=60
cache-static-ttl=60

enable-http-clone=0
enable-index-links=1
enable-index-owner=0
enable-remote-branches=0
enable-log-filecount=1
enable-log-linecount=1
enable-git-config=0
enable-ssdiff=1
snapshots=tar.xz zip

robots=noindex, nofollow

virtual-root=/
section-from-path=0
max-repo-count=50
scan-path=/srv/git
