worker_processes auto;
error_log stderr crit;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Prevent disk bloat: route all Nginx temporary files to /tmp/
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    access_log off;
    error_log stderr crit;

    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;
    tcp_nodelay on;
    types_hash_max_size 4096;
    keepalive_timeout 35;

    gzip on;
    gzip_min_length 10240;
    gzip_comp_level 1;
    gzip_vary on;
    gzip_disable msie6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/css text/javascript text/xml text/plain
               application/javascript application/json application/xml
               application/rss+xml application/atom+xml image/svg+xml;

    reset_timedout_connection on;
    client_body_timeout 10;
    send_timeout 5;

    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    client_body_buffer_size 128k;
    large_client_header_buffers 4 256k;

    server {
        listen          8080;
        server_name     localhost;
        root            /usr/share/webapps/cgit;

        location = /healthz {
            return 200 "ok";
        }

        location / {
            try_files $uri @cgit;
        }

        location /cgit-css/ {
            expires 30d;
        }

        location ~* ^.+(cgit\.(css|png|js)|favicon\.ico|robots\.txt) {
            expires 30d;
        }

        location @cgit {
            include             /etc/nginx/fastcgi_params;
            fastcgi_param       SCRIPT_FILENAME $document_root/cgit.cgi;
            fastcgi_param       PATH_INFO       $uri;
            fastcgi_param       QUERY_STRING    $args;
            fastcgi_param       HTTP_HOST       $host;
            fastcgi_param       CGIT_CONFIG     /tmp/cgitrc;
            fastcgi_pass        unix:/tmp/fcgiwrap.sock;
        }

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        location ~ /\. {
            deny all;
        }
    }
}
